[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-blackbox"
version = "0.1.0"
description = "Local-first flight recorder and diagnostic toolbox for AI coding agents"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Dhiraj Das", email = "dhirajhermes@atomicmail.ai" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
agent-doctor = "agent_blackbox.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_blackbox*"]
