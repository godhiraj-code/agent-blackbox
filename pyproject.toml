[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-blackbox"
version = "0.1.0"
description = "Local-first flight recorder and diagnostic toolbox for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dhiraj Das", email = "dhirajhermes@atomicmail.ai" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/godhiraj-code/agent-blackbox"
Repository = "https://github.com/godhiraj-code/agent-blackbox"
Issues = "https://github.com/godhiraj-code/agent-blackbox/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
agent-doctor = "agent_blackbox.cli:main"
agent-blackbox = "agent_blackbox.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_blackbox*"]

[tool.setuptools.package-data]
agent_blackbox = ["data/*.txt"]
